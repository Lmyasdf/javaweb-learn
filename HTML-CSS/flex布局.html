<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            /* 去除默认的外边距8px */
            margin: 0;
        }
        #div1{
            background-color: rgb(157, 156, 156);
            width: 500px;
            height: 300px;

            /* 开启弹性布局 */
            display: flex;
            flex-direction: column; /* 默认为row水平布局，设置主轴为水平 */
            /* 从头开始排列 */
            /* flex-end 从尾开始排列 */
            /* center 在主轴上居中排列 */
            /* space-between 先两边贴边，再平分剩余空间 */
            /* space-around 平分剩余空间*/
            justify-content: space-between;
    
        }
        .div2{
            background-color: rgb(137, 210, 137);
            border: 1px solid rgb(17, 17, 17);
            width: 80px;
            height:60px;
        }
    </style>
</head>
<body>
    <div id="div1">
        <div class="div2"></div>   
        <div class="div2"></div>
        <div class="div2"></div>
    </div>
</body>
</html>
