<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #div1{
            width: 400px; /* 宽度 默认是内容展示区域的宽度*/
            height: 300px; /* 高度 默认是内容展示区域的高度*/
            background-color: yellow; /* 背景颜色 */
            padding: 30px; /* 内边距 */
            box-sizing:border-box; /* 盒子模型是以边框为基准 */
            border: 20px solid #ff00ff; /* 边框 */
            margin: 30px; /* 外边距 */
        }
    </style>
</head>
<body>
    <div id="div1">
        AAAAAAAAAAAAAAAAAAAAA
    </div>
</body>
</html>
