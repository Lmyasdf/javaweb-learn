<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户信息</title>
    <style>
        table{
           border-collapse: collapse;
           margin: 30px auto;
           width: 70%;
        }
        th,td{
            border: 1px solid #000;
            padding: 10px;
        }
        th{
            background-color: #585757;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>用户信息</h1>
        <table>
            <thead>
                <tr>
                    <th>用户ID</th>
                    <th>用户名</th>
                    <th>年龄</th>
                    <th>姓名</th>
                    <th>密码</th>
                    <th>注册时间</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="e in userlist" :key="e.id">
                    <td>{{e.id}}</td>
                    <td>{{e.username}}</td>
                    <td>{{e.age}}</td>
                    <td>{{e.name}}</td>
                    <td>{{e.password}}</td>
                    <td>{{e.data}}</td>
                </tr>
                    
            </tbody>
        </table>
    </div>
    <!-- 引入axios -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script type="module">
        import {createApp} from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
        createApp({
            data(){
                return{
                    userlist:[]
                }
            },

            methods:{
                async search(){
                    const result = await axios.get('/list');
                    this.userlist = result.data;
                }
            },
            mounted(){
                this.search();
            }
        }).mount('#app');
    </script>
</body>
</html>
