<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- form表单标签
        action：表单数据的url地址
        method：提交方式
        get：默认，表单数据会出现在url后面
        post：不会显示在url中，表单数据会在消息体/请求体中提交到服务器

        注意：表单项要想能够采集数据，必须得设置name属性，表示当前表单项的名字
    -->
    <form action="/save" method="post">
        姓名:<input type="text" name="name"> <br><br>
        年龄:<input type="text" name="age"><br><br>

        选择性别：
        <input type="radio" name="gender" value="1">男
        <label><input type="radio" name="gender" value="2">女 <br><br>

        选择爱好：
        <label><input type="checkbox" name="hobby" value="足球">足球
        <label><input type="checkbox" name="hobby" value="篮球">篮球
        <label><input type="checkbox" name="hobby" value="跑步">跑步 <br><br>

        图片：<input type="file" name="file"> <br><br>

        生日：<input type="date" name="birthday"> <br><br>

        选择时间：<input type="time" name="time"> <br><br>

        学历：<select name="education">
            <option value="1">高中</option>
            <option value="2">大专</option>
            <option value="3">本科</option>
        </select> <br><br>
        
        描述：<textarea name="description" rows="10" cols="30"></textarea> <br><br>
        <input type="button" value="按钮">
        <input type="reset" value="重置">
        <input type="submit" value="提交">
    </form>
</body>
</html>
