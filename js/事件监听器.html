<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-事件监听器</title>
    <
</head>
<body>
    <input type="button" value="按钮" id="btn">
    <script>
        //1.获取元素
        let btn = document.querySelector('#btn');
        //2.绑定事件
        btn.addEventListener('click',() => { //可以多次绑定同一事件
            console.log('点击了按钮');
        })
        btn.addEventListener('click',() => { 
            console.log('点击了按钮222');
        })
    </script>
</body>
</html>
