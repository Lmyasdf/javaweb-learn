<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-基础语法</title>
</head>
<body>
    
    <script>
        //1.声明变量
        let a = 10;
        a = "hello";
        a = true;
        alert(a);

        //2.声明常量
        const PI = 3.14;
        //PI = 3.1415926; //错误，常量不能重新赋值

        console.log(PI); //输出到控制台
        alert(PI); //弹出提示框

        document.write(PI);//直接输出在页面，不常用
    </script>
</body>
</html>
